<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover Business Council organizations, events and recruiting opportunities."
    />
    <title>Business Council Hub</title>
    <script>
      const directory = window.location.pathname.replace(/\/index\.html$/i, "/");
      const basePath = directory.endsWith("/") ? directory : `${directory}/`;
      const destination = new URL(`${basePath}docs/`, window.location.origin);
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.href);
    </script>
  </head>
  <body>
    <p><a href="./docs/">Open Business Council Hub</a></p>
  </body>
</html>
